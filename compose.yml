services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: validadoc
      POSTGRES_USER: validadoc
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-validadoc_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - validadoc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validadoc -d validadoc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  validadoc_postgres:
